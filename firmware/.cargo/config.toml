[target.thumbv6m-none-eabi]
# Only the ST-LINK on J2 (0483:374b), never another probe on the PC: one with someone else's board
# would be flashed. `just run` adds the serial of CANNIFY_PROBE for a PC with two CANnify boards.
runner = "probe-rs run --chip STM32G0B1CE --probe 0483:374b"
# runner = "cnt run --chip STM32G0B1CE --probe 0483:374b" # adds the defmt log plus live counters (cargo install cnt_cli), `just cnt`
# Stack overflow protection: the stack goes below .data/.bss and overflows fault (cargo install flip-link)
linker = "flip-link"

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug,cannify_micro=debug"
# DEFMT_RTT_BUFFER_SIZE = "4096" # larger buffer avoids losing output in bursts (init)
CNT_RAM_BUFFER_SIZE_WORDS = "64"
CNT_BKP_BUFFER_SIZE_WORDS = "4" # must fit into BKPSRAM in memory.x (the fifth register is the boot word, src/boot.rs)

# [unstable]
# build-std = ["core"]                              # smaller binaries (nightly + rust-src)
# build-std-features = ["panic_immediate_abort"]   # even smaller, panics become aborts
