[package]
name = "cannify_micro"
version = "0.1.0"
edition = "2024"

# standalone crate: keeps an enclosing Cargo workspace from claiming it
[workspace]

[dependencies]
defmt = "1.1"
# defmt's global logger: every frame into device.log over WireWeaver, teed to the RTT channel "defmt" that probe-rs /
# cnt run show (src/log.rs)
ww_defmt_logger = { git = "https://github.com/vhrdtech/wire_weaver", features = ["rtt"] }
rtt-target = "0.6" # the RTT channels: the log's tee (src/log.rs)
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1.11", features = ["critical-section"] } # atomics for Cortex-M0(+)
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g0b1ce", "unstable-pac", "exti", "time", "time-driver-tim4"] } # not "any": it may take TIM15, D14's PWM (src/led.rs)
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
static_cell = "2.1"
assign-resources = "0.5.0"
cnt = "0.5" # 0.5: used words and format version, served as device.counters (ww_counters)
# crash capture: HardFault / panic record kept across reset, reset cause (src/last_reset.rs); the panic handler
bedrock_crash = { git = "https://github.com/romixlab/embedded_bedrock", features = ["cortex-m", "defmt"] }
# firmware updates through the STM32 ROM bootloader (src/boot.rs): the early boot, reboot(Updater), boot-loop rescue,
# device.boot and device.dfu.node
bedrock_rom_boot = { git = "https://github.com/romixlab/embedded_bedrock", features = ["stm32g0", "embassy", "ww-dfu", "defmt"] }
# D14 breathes, blinks, identifies on TIM15_CH1 PWM (src/led.rs), aligned to shared time; `leds` (src/ww/leds.rs)
bedrock_led = { git = "https://github.com/romixlab/embedded_bedrock", features = ["embassy", "ww-indication", "defmt"] }
# the shared clock a host steers onto UTC (src/sync.rs), served as `clock` (src/ww/clock.rs)
bedrock_sync = { git = "https://github.com/romixlab/embedded_bedrock", features = ["embassy", "ww-timebase", "defmt"] }
# settings store in the SETTINGS flash region (src/settings.rs)
ww_settings = { git = "https://github.com/vhrdtech/wire_weaver", features = ["defmt"] }
# flash reads that survive an ECC error left by a power cut
ww_ecc_flash = { git = "https://github.com/vhrdtech/wire_weaver", features = ["stm32g0"] }
ww_user_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
# raw access to the free pins (src/pins.rs)
ww_pin_diag = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["defmt"] }
ww_gpio = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["defmt"] } # its Level, Pull
ww_error = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
# WireWeaver: API crate next to the firmware, served by src/ww.rs
cannify_micro_api = { path = "../cannify_micro_api", features = ["defmt"] }
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
embassy-futures = "0.1.2" # select in the server task (src/ww.rs)
ww_firmware_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["build-id", "cortex-m", "defmt"] }
# the device contract's stdlib traits (`device` in the API crate): types in the handler signatures (src/ww/device.rs)
ww_board_info = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["time", "u32"] }
ww_indication = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_timebase = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_date_time = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false } # clock.set_time_of_day
ww_uid = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_counters = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_log = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_dfu = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["defmt"] }
# reliable stream state of device.log; persistent-ram: its store in .uninit RAM, kept across a crash and reset
ww_stream = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["persistent-ram"] }
wire_weaver_usb_embassy = { git = "https://github.com/vhrdtech/wire_weaver" }

[build-dependencies]
ww_firmware_info = { git = "https://github.com/vhrdtech/wire_weaver", features = ["build"] } # FirmwareInfo facts (build.rs)

# See https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3           # embedded dev builds are usually unusable at opt-level 0
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2               # debug info does not end up in flash
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"         # 3 = speed, s = size, z = smaller
overflow-checks = false

# Do not optimize build scripts / proc-macros: faster clean builds
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

