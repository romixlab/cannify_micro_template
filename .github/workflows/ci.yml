name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: API evolution check
        run: just api-check
      - run: cargo test --workspace --locked

  firmware:
    name: firmware (fmt, clippy, dev and release build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: thumbv6m-none-eabi
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: flip-link
      - run: cargo fmt --all --check
      - run: cargo clippy --bins --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo build --release --locked

  python:
    name: python module (wheel, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v6
      - run: uv build --project cannify_micro_py --wheel
      - run: cd cannify_micro_py && uv run --group dev pytest
